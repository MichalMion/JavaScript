<textarea style="height: 457px; width: 736px;">
<!DOCTYPE html>   
<head>    
<title> Użycie fukcji </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_mio(a, b) { 
return a + b; 
} 
function odejmowanie_mio(a, b) { 
return a - b; 
} 
function od_kwadratu_mio(a, b) { 
return Math.pow(a, 2);
return Math.pow(b, 2); 
} 
function reszta_z_dzielenia_a_przez_b_mio(a, b) {
    return a % b;
}
document.write("suma="+suma_mio(a,b)+"<br>"); 
document.write("odejmowanie="+odejmowanie_mio(a,b)+"<br>"); 
document.write(a+"^2="+od_kwadratu_mio(a)+"<br>"); 
document.write(b+"^2="+od_kwadratu_mio(b)+"<br>"); 
document.write(a+" % "+b+" = "+reszta_z_dzielenia_a_przez_b_mio(a,b)+"<br>"); 
</script> 
</div> 
</body> 
</html> 
</textarea>
