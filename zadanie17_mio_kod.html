    <h1>Odpowiedzi na pytania teoretyczne</h1>

    <p><b><u>1. Wymień cztery sposoby wyprowadzania danych w JS:</u></b></p>
    <ul>
        <li>Z użyciem <b><u>document.write()</u></b></li>
        <li>Z użyciem <b><u>okienka alert()</u></b></li>
        <li>Do <b><u>okienek formularza</u></b></li>
        <li>Do <b><u>tabeli</u></b></li>
    </ul>

    <p><b><u>2. Czym jest funkcja w JS, omów przy użyciu 4 podpunktów?</u></b></p>
    <ul>
        <li>Jest to <b><u>zbiór zgrupowanych instrukcji</u></b>, które możemy uruchamiać poprzez podanie ich nazwy.</li>
        <li>Każda funkcja po wywołaniu <b><u>wykonuje swój wewnętrzny kod</u></b>.</li>
        <li>Funkcja może mieć <b><u>argumenty</u></b>, które wchodzą do wnętrza funkcji i są tam przetwarzane np. suma_kry(a, b).</li>
        <li>Może (nie zawsze) <b><u>zwrócić obliczoną wartość</u></b> zapisaną po słowie kluczowym return.</li>
    </ul>

    <p><b><u>3. Omów metody getElementsByName, getElementById, getElementByTagName (może być w postaci tabeli):</u></b></p>
    <table border="1">
        <tr>
            <th>Metoda</th>
            <th>Opis</th>
        </tr>
        <tr>
            <td>getElementById("id")</td>
            <td>Dostęp do wszystkich elementów o konkretnej wartości atrybutu id.</td>
        </tr>
        <tr>
            <td>getElementsByTagName("znacznik")</td>
            <td>Dostęp do wszystkich elementów o typie znacznika, np. P lub DIV.</td>
        </tr>
        <tr>
            <td>getElementsByName("nazwa")</td>
            <td>Dostęp do wszystkich elementów o konkretnej wartości atrybutu nazwa.</td>
        </tr>
    </table>

    <p><b><u>4. Omów właściwości innerHTML, innerText, className (każdą osobno):</u></b></p>
    <ul>
        <li><b><u>innerHTML</u></b> – jest to właściwość, która umożliwia odczyt, zmodyfikowanie, wstawienie, albo usunięcie kodu HTML z danego elementu HTML np. w tabeli.</li>
        <li><b><u>innerText</u></b> – umożliwia określenie ciągu znaków, który zostanie umieszczony w elemencie.</li>
        <li><b><u>className</u></b> – umożliwia określenie klasy CSS użytej do prezentacji elementu.</li>
    </ul>
