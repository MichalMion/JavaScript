<textarea style="width: 716px; height: 457px;">
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <div id="wynik" style="color: blue; font-size: 2cm;"></div>

    <script>
        function oblicz() {
            var iloscPoczatkowa = parseFloat(prompt("Podaj początkową ilość atomów No (sztuk):"));
            var czas = parseFloat(prompt("Podaj czas t (w latach):"));
            var czasPolowicznego = parseFloat(prompt("Podaj czas połowicznego rozpadu T1/2 (w latach):"));



            var lambda = Math.log(2) / czasPolowicznego;
            var iloscAtomow = iloscPoczatkowa * Math.exp(-lambda * czas);

            var wynik = "No= " + iloscPoczatkowa + " [sztuk]<br>" +
                        "t= " + czas + " [lat]<br>" +
                        "T1/2= " + czasPolowicznego + " [lat]<br>" +
                        "Lambda= " + lambda.toFixed(7) + "[1/rok]<br>" +
                        "N= " + iloscAtomow.toFixed(7) + " [sztuk]";

            document.getElementById("wynik").innerHTML = wynik;
        }

        oblicz();
    </script>

</body>
</html>
<!--Michał Mionskowski 2P-->
</textarea>
