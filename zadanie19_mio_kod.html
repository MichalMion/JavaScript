<textarea style="width: 736px; height: 446px;">
<html> 
 <head> 
  <meta charset="UTF-8"> 
  <link rel="stylesheet" href="styl.css"> 
 </head> 
<body> 
 <script type="text/javascript"> 
  function pole_mionskowski() 
   { 
 var a_mio= parseFloat(document.getElementById('dlugosc').value); 
 var b_mio= a_mio*a_mio; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_mio.toFixed(2)+" cm^2";  
   } 
  function obwod_mionskowski() 
   { 
 var a_mio= parseFloat(document.getElementById('dlugosc').value); 
 var b_mio= 4*a_mio; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_mio.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_mionskowski()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_mionskowski()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body> 
</html> 
</textarea>
